name: Release

# Releases every module at one version: each module gets a <module>/<version>
# tag on the same commit of main. The version comes from the `version` input,
# or from the VERSION file when the input is empty.
#
#   gh workflow run release.yml                 # uses VERSION
#   gh workflow run release.yml -f version=v0.2.0
#
# Flow:
#   1. release: .github/scripts/release.sh checks the version shape, each
#      module's major against its module path, that every sibling require is
#      the version, and that no tag or proxy.golang.org version exists yet. Only
#      then does it tag HEAD for every module and push all tags in one atomic
#      push. A failed check pushes nothing.
#   2. verify-install: .github/scripts/verify-install.sh runs go get on every
#      module at the version from a fresh module outside the repo, then builds an
#      import of each. It retries while the proxy catches up after the tag push.
#
# Recovery: a pushed tag is permanent. Deleted tags stay in proxy.golang.org and
# the checksum database, so a reused version gives consumers a checksum mismatch.
# A failed or bad release is fixed forward: bump the patch version (for example
# v0.1.1), update VERSION in a commit on main, and release that version. Never
# reuse a version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example v0.2.0. Leave empty to use the VERSION file.
        required: false
        type: string

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.5"

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ inputs.version || 'VERSION file' }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$INPUT_VERSION
          if [ -z "$version" ]; then
            version=$(tr -d '[:space:]' < VERSION)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check, tag, and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release.sh "$VERSION"

  verify-install:
    name: Verify ${{ needs.release.outputs.version }} installs
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install every module from the proxy and build
        run: .github/scripts/verify-install.sh "$VERSION"
