name: Release

# Tags one module by hand. Nothing is tagged on push to main: every module is
# still in development, so each release is a deliberate decision.
#
#   gh workflow run release.yml -f module=observability -f version=v0.2.0
#
# The tag is <module dir>/<version> on the current main. The run fails when:
#   - the directory has no go.mod, or the version is not vMAJOR.MINOR.PATCH
#     (an optional -prerelease suffix is allowed);
#   - the major does not match the module path (v2+ needs a /vN path, and a
#     /vN path needs vN.x.y), because Go cannot resolve such a tag;
#   - the tag exists, or proxy.golang.org already has the version. Deleted
#     tags stay in the proxy and the checksum database, so a reused version
#     gives every consumer a checksum mismatch.

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module directory, for example observability
        required: true
        type: string
      version:
        description: Version to tag, for example v0.2.0
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag ${{ inputs.module }}/${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate and push tag
        env:
          MODULE: ${{ inputs.module }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "$MODULE" =~ ^[a-z0-9_-]+$ && -f "$MODULE/go.mod" ]] || fail "$MODULE is not a module directory"
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] \
            || fail "$VERSION is not vMAJOR.MINOR.PATCH"
          major="${BASH_REMATCH[1]}"

          path=$(awk '/^module /{print $2; exit}' "$MODULE/go.mod")
          if [[ "$path" =~ /v([0-9]+)$ ]]; then
            [ "$major" = "${BASH_REMATCH[1]}" ] || fail "$path needs a v${BASH_REMATCH[1]}.x.y version"
          elif [ "$major" -ge 2 ]; then
            fail "v$major needs the module path to end in /v$major (it is $path)"
          fi

          tag="$MODULE/$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            fail "$tag already exists"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://proxy.golang.org/$path/@v/$VERSION.info")
          [ "$code" != 200 ] || fail "$path@$VERSION is already in proxy.golang.org; pick a new version"

          git tag -a "$tag" -m "Release $MODULE $VERSION"
          git push origin "$tag"
          echo "tagged $tag at $(git rev-parse --short HEAD)"
