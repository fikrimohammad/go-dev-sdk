name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.5"
  GOLANGCI_VERSION: v2.15.0
  STRICT_LINT_MODULES: '["errgroup","errs","identity","observability","rest"]'

jobs:
  modules:
    name: Discover modules
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
      - id: discover
        run: |
          modules=$(find . -maxdepth 2 -name go.mod -not -path './vendor/*' -printf '%h\n' \
            | sed 's|^\./||' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.module }}
    needs: modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: ${{ matrix.module }}
          # Modules in STRICT_LINT_MODULES are linted on the full tree; all others
          # fail only on new issues. Add a module in the commit that makes it clean;
          # never remove one.
          only-new-issues: ${{ !contains(fromJSON(env.STRICT_LINT_MODULES), matrix.module) }}
          # The restored lint cache served stale results: on an unchanged commit it
          # reported two nolintlint findings that an uncached run doesn't. A full
          # uncached run of a module takes seconds, so results stay deterministic.
          skip-cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Test with race detector
        run: go test -count=1 -race -shuffle=on ./...

      - name: Tidy check
        run: go mod tidy -diff
